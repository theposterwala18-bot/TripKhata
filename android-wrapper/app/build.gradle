plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.theposterwala.tripkhata'
    compileSdk 36

    defaultConfig {
        applicationId 'com.theposterwala.tripkhata'
        minSdk 24
        targetSdk 36
        versionCode 1017
        versionName '1.0.17'
    }

    signingConfigs {
        testDebug {
            storeFile file('tripkhata-test-debug.keystore')
            storePassword 'tripkhata123'
            keyAlias 'tripkhata_test'
            keyPassword 'tripkhata123'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.testDebug
        }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
