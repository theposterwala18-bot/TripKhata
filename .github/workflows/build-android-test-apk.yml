name: Build TripKhata Test APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-android-test-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android-wrapper
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk TripKhata-v0.7.3-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TripKhata-v0.7.3-test-apk
          path: TripKhata-v0.7.3-test.apk
          retention-days: 30
