name: Remove Retired Legacy Login

permissions:
  contents: write

on:
  push:
    branches: [ fix-cloud-startup-v1010 ]
    paths:
      - 'auth-v100.js'
      - 'fund-edit-v041.js'
      - 'index.html'
      - '.github/workflows/remove-legacy-login.yml'
  workflow_dispatch:

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-cloud-startup-v1010
      - name: Remove retired v0.2.1 login from embedded base
        shell: python
        run: |
          import re,base64,gzip,pathlib
          p=pathlib.Path('index.html')
          src=p.read_text(encoding='utf-8')
          m=re.search(r'atob\("([A-Za-z0-9+/=]+)"\)',src)
          if not m: raise SystemExit('embedded html not found')
          html=gzip.decompress(base64.b64decode(m.group(1))).decode('utf-8')

          # Physically remove the retired login page markup.
          html,n1=re.subn(r'\n\s*<section id="authView" class="login hidden">.*?</section>\s*\n','\n',html,count=1,flags=re.S)

          # Remove legacy login-only CSS line.
          html=re.sub(r'^\.login\{.*?\.seg button\.active\{[^\n]*\}\s*\n','',html,count=1,flags=re.M)

          # Remove retired demo auth functions; keep a compatibility authRender
          # that only exposes the real dashboard for the modern auth layer.
          html,n2=re.subn(
            r'function authRender\(\)\{.*?\}\nfunction setAuthMode\(m\)\{.*?\}\nfunction signupDemo\(\)\{.*?\}\nfunction continueGuest\(\)\{.*?\}\n',
            "function authRender(){mainView.classList.remove('hidden');renderAll()}\n",
            html,count=1,flags=re.S
          )

          # Retired base logout must never reopen the deleted legacy login.
          html=re.sub(
            r'function logout\(\)\{state\.user=null;save\(\);closeModal\(\);authRender\(\)\}',
            "function logout(){closeModal();if(window.tripKhataLogout)window.tripKhataLogout()}",
            html,count=1
          )

          html=html.replace('<title>TripKhata v0.2.1</title>','<title>TripKhata</title>')
          html=html.replace('/* v0.2.1 Professional Dashboard Redesign */','/* TripKhata dashboard base */')
          html=html.replace('Current v0.2 link workflow is ready; cross-phone live data activates after cloud backend connection.','Invite this trip with your friends.')

          if n1!=1 or n2!=1:
            raise SystemExit(f'cleanup mismatch auth_markup={n1} auth_functions={n2}')
          if 'id="authView"' in html or 'function signupDemo()' in html or 'v0.2.1' in html:
            raise SystemExit('retired login remnants still present')

          packed=base64.b64encode(gzip.compress(html.encode('utf-8'),compresslevel=9)).decode('ascii')
          src=src[:m.start(1)]+packed+src[m.end(1):]
          p.write_text(src,encoding='utf-8')
      - name: Commit cleaned base
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove retired v0.2.1 login from embedded base"
          git push origin HEAD:fix-cloud-startup-v1010
