name: Extract Trip Core Functions
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract core trip functions
        shell: python
        run: |
          import re,base64,gzip,pathlib
          src=pathlib.Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'atob\("([A-Za-z0-9+/=]+)"\)',src)
          html=gzip.decompress(base64.b64decode(m.group(1))).decode('utf-8')
          terms=['Create New Trip','function createTrip','function saveTrip','function openTrip','function editTrip','function deleteTrip','My Trips','state.trips','tripForm']
          out=[]
          for term in terms:
            out.append('\n### '+term+'\n')
            start=0
            while True:
              i=html.find(term,start)
              if i<0: break
              out.append(html[max(0,i-2500):i+7000]+'\n---\n')
              start=i+len(term)
          pathlib.Path('trip-core.txt').write_text(''.join(out),encoding='utf-8')
      - uses: actions/upload-artifact@v4
        with:
          name: trip-core-inspection
          path: trip-core.txt