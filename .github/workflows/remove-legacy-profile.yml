name: Remove Legacy Profile Popup
permissions:
  contents: write
on:
  push:
    branches: [ fix-cloud-restore-v1015 ]
    paths:
      - 'final-ui-v061.js'
      - '.github/workflows/remove-legacy-profile.yml'
  workflow_dispatch:
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-cloud-restore-v1015
      - name: Replace old profile popup with current profile bridge
        shell: python
        run: |
          import re,base64,gzip,pathlib
          p=pathlib.Path('index.html')
          src=p.read_text(encoding='utf-8')
          m=re.search(r'atob\("([A-Za-z0-9+/=]+)"\)',src)
          html=gzip.decompress(base64.b64decode(m.group(1))).decode('utf-8')
          pat=r'function openProfile\(\)\{modalRoot\.innerHTML=\x60.*?</div></div>\x60\}'
          html,n=re.subn(pat,"function openProfile(){if(window.tripKhataOpenProfile)return window.tripKhataOpenProfile()}",html,count=1,flags=re.S)
          if n!=1: raise SystemExit('old profile popup not found exactly once')
          if 'Firebase/Supabase adapter point' in html or 'Not connected</span>' in html or 'Profile & Sync</div>' in html:
            raise SystemExit('legacy profile text still present')
          packed=base64.b64encode(gzip.compress(html.encode('utf-8'),compresslevel=9)).decode('ascii')
          src=src[:m.start(1)]+packed+src[m.end(1):]
          p.write_text(src,encoding='utf-8')
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove legacy disconnected profile popup"
          git push origin HEAD:fix-cloud-restore-v1015