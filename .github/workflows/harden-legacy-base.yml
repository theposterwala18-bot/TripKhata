name: Harden Legacy Base State
permissions:
  contents: write
on:
  push:
    branches: [ fix-cloud-restore-v1015 ]
    paths:
      - 'sync-v060.js'
      - '.github/workflows/harden-legacy-base.yml'
  workflow_dispatch:
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-cloud-restore-v1015
      - name: Disable unsafe legacy cross-tab state overwrite
        shell: python
        run: |
          import re,base64,gzip,pathlib
          p=pathlib.Path('index.html')
          src=p.read_text(encoding='utf-8')
          m=re.search(r'atob\("([A-Za-z0-9+/=]+)"\)',src)
          html=gzip.decompress(base64.b64decode(m.group(1))).decode('utf-8')
          old="const bc=('BroadcastChannel' in window)?new BroadcastChannel('tripkhata-sync'):null;\nif(bc)bc.onmessage=e=>{if(e.data?.type==='state'){state=e.data.state;localStorage.setItem(KEY,JSON.stringify(state));renderAll();toastMsg('Synced on this device');}};\nfunction save(sync=true){localStorage.setItem(KEY,JSON.stringify(state));if(sync&&bc)bc.postMessage({type:'state',state});}"
          new="const bc=null;\nfunction save(sync=true){localStorage.setItem(KEY,JSON.stringify(state));}"
          if old not in html: raise SystemExit('legacy BroadcastChannel block not found')
          html=html.replace(old,new,1)
          if "BroadcastChannel('tripkhata-sync')" in html: raise SystemExit('unsafe BroadcastChannel still present')
          packed=base64.b64encode(gzip.compress(html.encode('utf-8'),compresslevel=9)).decode('ascii')
          src=src[:m.start(1)]+packed+src[m.end(1):]
          p.write_text(src,encoding='utf-8')
      - name: Commit hardened base
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Disable unsafe legacy cross-tab state overwrite"
          git push origin HEAD:fix-cloud-restore-v1015