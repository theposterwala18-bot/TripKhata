name: Diagnose TripKhata State Race
on:
  push:
    branches: [ diagnose-state-race-v1013 ]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and inspect state functions
        shell: python
        run: |
          import re,base64,gzip,pathlib
          src=pathlib.Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'atob\("([A-Za-z0-9+/=]+)"\)',src)
          html=gzip.decompress(base64.b64decode(m.group(1))).decode('utf-8')
          terms=['function save','function createTrip','function addExpense','function saveExpense','expenses.unshift','function renderAll','function getTrip','localStorage.setItem','localStorage.getItem']
          out=[]
          for term in terms:
            out.append('\n### '+term+'\n')
            start=0
            while True:
              i=html.find(term,start)
              if i<0: break
              out.append(html[max(0,i-1800):i+5000])
              out.append('\n---\n')
              start=i+len(term)
          for fn in ['sync-v060.js','fund-v040.js','fund-edit-v041.js','final-ui-v061.js']:
            p=pathlib.Path(fn)
            if p.exists():
              out.append('\n### FILE '+fn+'\n'+p.read_text(encoding='utf-8'))
          pathlib.Path('diagnostic.txt').write_text(''.join(out),encoding='utf-8')
      - uses: actions/upload-artifact@v4
        with:
          name: tripkhata-state-diagnostic
          path: diagnostic.txt
