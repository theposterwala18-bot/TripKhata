name: Verify TripKhata Play Store Android Build

on:
  push:
    branches: [ playstore-release-v1.0.15 ]
    paths:
      - 'android-wrapper/**'
      - 'auth-v100.js'
      - '.github/workflows/verify-playstore-android.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK 36
        shell: bash
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compile debug APK
        working-directory: android-wrapper
        run: gradle assembleDebug --stacktrace

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: TripKhata-v1.0.15-final-icon-test-apk
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk

      - name: Compile release APK
        working-directory: android-wrapper
        run: gradle clean assembleRelease --stacktrace --no-daemon

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: TripKhata-v1.0.15-unsigned-release-apk
          path: android-wrapper/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Compile release AAB
        working-directory: android-wrapper
        run: gradle clean bundleRelease --stacktrace --no-daemon

      - name: Upload unsigned verification bundle
        uses: actions/upload-artifact@v4
        with:
          name: TripKhata-v1.0.15-unsigned-verification
          path: android-wrapper/app/build/outputs/bundle/release/app-release.aab

